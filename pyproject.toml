# NOTE: Keep python versions up to date with the system version
# Maybe write a local hook to check that? But it might not work in other environments.

[tool.ruff]
target-version = 'py314'
line-length = 100

[tool.ruff.format]
quote-style = 'single'
line-ending = 'lf'


[tool.basedpyright]
typeCheckingMode = 'standard'
pythonVersion = '3.14'
pythonPlatform = 'Linux'
deprecateTypingAliases = true
# Avoid "'indentifier' not exported from 'module'" errors, see
# https://github.com/microsoft/pyright/issues/2277#issuecomment-937468789
reportPrivateImportUsage = false
reportMatchNotExhaustive = true
reportMissingParameterType = true
reportConstantRedefinition = true
reportUnnecessaryComparison = true
reportIgnoreCommentWithoutRule = true

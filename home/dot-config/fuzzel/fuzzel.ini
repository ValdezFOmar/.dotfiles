# Font
font = Noto Sans:size=10:weight=Medium

# Prompt
prompt = ""
placeholder = Search...
match-counter = true

# List
lines = 8
line-height = 20
show-actions = true
minimal-lines = true
icon-theme = Papirus-Dark

# Window
width = 32
anchor = top
y-margin = 5
inner-pad = 10
vertical-pad = 20
horizontal-pad = 30

# Launcher
terminal = kitty
launch-prefix = uwsm app --

[border]
width = 1
radius = 10
selection-radius = 10

# Reference colors: ~/.config/waybar/style.css
[colors]
text = ecfeffb2
input = ecfeffff
prompt = ecfeffff
counter = ecfeffcc
message = ecfeffff
placeholder = ecfeff66
match = ecfeffff
selection = ecfeff33
selection-text = ecfeffff
selection-match = ecfeffff
border = 005f78ff
background = 053345cc

monitor = , preferred, auto, 1
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
monitor = desc:Shenzhen KTC Technology Group Android TV 0x00000001, 1360x768@60, auto, 1, mirror, eDP-1

### Run programs at startup
exec-once = uwsm app -- xrdb ~/.config/xorg/Xresources
exec-once = uwsm app -- hyprctl setcursor Qogir-cursors 24
exec-once = uwsm app -- copyq --start-server
exec-once = uwsm app -- udiskie --automount --notify --smart-tray
exec-once = uwsm app -- polkit-gnome-authentication-agent-1.desktop
exec-once = uwsm app -- ~/.config/hypr/scripts/volume-indicator.py

# Wine will error if the variable is defined but the directory doesn't already exist
exec-once = test -n "$WINEPREFIX" && mkdir --parents "$WINEPREFIX"

# Commonly used programs
exec-once = [workspace 1 silent] uwsm app -- firefox
exec-once = [workspace 2 silent] uwsm app -- kitty --hold --directory ~ fastfetch

### Keybindings ###

$mod = SUPER # Sets "Windows" key as main modifier

# Misc
bind = $mod, Q, exec, uwsm app -- ~/bin/powermenu.py
bind = $mod, L, exec, uwsm app -- hyprlock
bind = $mod, D, exec, ~/.config/hypr/scripts/toggle-dim.bash

# Applications
bind = $mod, RETURN, exec, uwsm app -- kitty
bind = $mod, B, exec, uwsm app -- firefox
bind = $mod, E, exec, uwsm app -- pcmanfm
bind = $mod, O, exec, uwsm app -- fuzzel
bind = $mod, H, exec, uwsm app -- copyq show
bind = $mod, P, exec, pidof hyprpicker || uwsm app -- hyprpicker --autocopy --format=hex

# Screenshot actions
bindl =     , Print, exec, uwsm app -- ~/bin/screenshot screen
bind  = CTRL, Print, exec, uwsm app -- ~/bin/screenshot region

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +2.5% --exponent=8
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 2.5%- --exponent=8

# Operations on windows
bind = $mod, C, killactive,
bind = $mod, F, fullscreen, 0  # Fullscreen window
bind = $mod, M, fullscreen, 1  # Maximize window
bind = $mod, V, togglefloating,

# Switch window focus
bind = $mod, J, cyclenext, tiled
bind = $mod, K, cyclenext, prev tiled
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, J, swapnext,
bind = $mod SHIFT, K, swapnext, prev

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


### Configuration ###

$active_border = rgb(00d3f2) rgb(cefafe) 90deg
$inactive_border = rgb(005f78)

general {
    border_size = 1

    gaps_in = 2
    gaps_out = 5

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    # col.active_border = $color7 $color4 90deg
    # col.inactive_border = $color2

    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true

    allow_tearing = true

    snap:enabled = true
}

misc {
    # NOTE:
    # There's some strange behavior when staging this file after
    # pre-commit runs, so it's better to disable it and just run
    # `hyprctl reload` when necessary
    disable_autoreload = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    force_default_wallpaper = -1
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

xwayland {
    # Avoid pixelated Xorg apps
    force_zero_scaling = true
}

input {
    kb_layout = us,latam
    kb_options = grp:win_space_toggle

    follow_mouse = 1

    touchpad {
        disable_while_typing = true
        natural_scroll = false
    }
}

gestures {
    gesture = 3, horizontal, workspace
    gesture = 3, up, fullscreen
}

dwindle {
    force_split = 2
    preserve_split = true
}


### Window, Workspace and Layer rules ###

layerrule = blur true, ignore_alpha 0, match:namespace waybar
layerrule = blur true, ignore_alpha 0, match:namespace launcher
layerrule = blur true, ignore_alpha 0, match:namespace notifications

# Default floating windows
windowrule = float true, match:class firefox, match:title (Library)|(About Mozilla Firefox)|(Firefox - Choose User Profile)
windowrule = float true, match:class blueman-manager
windowrule = float true, match:class com\.github\.hluk\.copyq

# Ignore maximize requests from apps
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Inactive border when there's only one window on screen
#   w[v1] -> one visible window
#   f[1]  -> maximized window
windowrule = border_color $inactive_border, match:float false, match:workspace w[v1]
windowrule = border_color $inactive_border, match:float false, match:workspace f[1]


### Decorations and animations ###

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.3

    blur {
        enabled = true
        size = 4
        passes = 2
        xray = off
        vibrancy = 0.1696
    }

    shadow:enabled = false
}

animations {
    enabled = yes

    # https://easings.net/
    bezier = linear, 0, 0, 1, 1
    bezier = ease-in-sine, 0.12, 0, 0.39, 0
    bezier = ease-out-sine, 0.61, 1, 0.88, 1
    bezier = ease-out-cubic, 0.33, 1, 0.68, 1

    animation = layersIn, 1, 6, ease-out-cubic, slide
    animation = layersOut, 1, 6, ease-in-sine, slide
    animation = windowsIn, 1, 6, ease-out-cubic, popin 40%
    animation = windowsOut, 1, 3, linear, popin 60%

    animation = fadeIn, 1, 6.5, ease-out-cubic
    animation = fadeOut, 1, 3, ease-out-sine
    animation = fadeLayersIn, 1, 6, ease-out-cubic
    animation = fadeLayersOut, 1, 8, ease-out-sine
}

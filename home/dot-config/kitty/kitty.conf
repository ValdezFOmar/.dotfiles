# Terminal colors
foreground #eeeeec
background #000000
background_opacity 0.7

# Inverted selection
selection_foreground none
selection_background none

# 'Idle toes' theme
color0  #323232
color8  #535353
color1  #d25252
color9  #f07070
color2  #7fe173
color10 #9dff90
color3  #ffc66d
color11 #ffe48b
color4  #4098ff
color12 #5eb7f7
color5  #f57fff
color13 #ff9dff
color6  #bed6ff
color14 #dcf4ff
color7  #eeeeec
color15 #ffffff

# Font
font_size         12.5
font_family       family="Cascadia Code"
bold_font         auto
italic_font       auto
bold_italic_font  auto
disable_ligatures cursor
# Kitty's built in nerd font symbols
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Cursor
cursor       none
cursor_shape block
cursor_trail 9
cursor_trail_start_threshold 5

# URL
url_color #5eb7f7
url_style straight

# Tabs
tab_bar_align center
tab_bar_style separator
tab_separator "  │  "
tab_title_template "{title if tab.active_exe != 'bash' else (title[-1] if title.endswith(('/', '~')) else title.split('/')[-1])}"
tab_title_max_length 30

active_tab_foreground   #000000
active_tab_background   #5eb7f7
active_tab_font_style   bold
inactive_tab_foreground #5eb7f7
inactive_tab_background #323232
inactive_tab_font_style normal

# Windows
bell_border_color     #f07070
active_border_color   #5eb7f7
inactive_border_color #535353

# Other Options
editor /usr/bin/nvim
enable_audio_bell no
enabled_layouts Tall
auto_reload_config -1
notify_on_cmd_finish unfocused

# keymaps
map ctrl+s no_op
map ctrl+c combine : copy_or_interrupt : clear_selection
# Breaks neovim selection
# map ctrl+v paste_from_clipboard

# Clear screen into the scrollback buffer
map kitty_mod+l clear_terminal to_cursor_scroll active

map kitty_mod+t new_tab_with_cwd
map kitty_mod+enter new_window_with_cwd
